name: Deploy Node.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

    # 1. Get source code
    - name: Checkout code
      uses: actions/checkout@v4


    # 2. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    # 3. Build Docker image
    - name: Build Docker image
      run: |
        docker build -t naziksalihu/devops-nodejs-demo:latest .


    # 4. Push image to Docker Hub
    - name: Push Docker image
      run: |
        docker push naziksalihu/devops-nodejs-demo:latest


    # 5. Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |
          echo "Pulling latest Docker image..."

          docker pull naziksalihu/devops-nodejs-demo:latest


          echo "Stopping old container..."

          docker stop devops-nodejs-demo || true


          echo "Removing old container..."

          docker rm devops-nodejs-demo || true


          echo "Starting new container..."

          docker run -d \
            --name devops-nodejs-demo \
            -p 80:5006 \
            --restart always \
            naziksalihu/devops-nodejs-demo:latest


          echo "Deployment completed successfully!"